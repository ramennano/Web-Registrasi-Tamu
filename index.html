<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Buku Tamu Digital</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav>
        <h2>Buku Tamu</h2>
        <div id="nav-menus">
            <button onclick="showPage('guest-page')">Form Tamu</button>
            <button onclick="showPage('login-page')" id="btn-login-nav">Login Staff</button>
            <button onclick="logout()" id="btn-logout" style="display: none;">Logout</button>
        </div>
    </nav>

    <!-- HALAMAN REGISTRASI TAMU -->
    <div id="guest-page" class="page active">
        <div class="card">
            <h3>Registrasi Tamu Masuk</h3>
            <form id="form-tamu">
                <div class="form-group">
                    <label>Nama Tamu</label>
                    <input type="text" id="nama_tamu" required placeholder="Masukkan nama Anda">
                </div>
                <div class="form-group">
                    <label>Instansi / Perusahaan</label>
                    <select id="instansi_id" required>
                        <option value="">-- Pilih Instansi --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Orang Yang Dituju</label>
                    <select id="tujuan_id" required>
                        <option value="">-- Pilih Tujuan --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Keperluan</label>
                    <textarea id="keperluan" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Kirim Registrasi</button>
            </form>
        </div>
    </div>

    <!-- HALAMAN LOGIN -->
    <div id="login-page" class="page">
        <div class="card">
            <h3>Login Staff / Admin</h3>
            <div id="login-step-1">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button onclick="login()" class="btn-primary">Login</button>
            </div>
            
            <div id="login-step-2" style="display: none;">
                <h4>Verifikasi 2FA</h4>
                <p>Masukkan 6 digit kode dari aplikasi Authenticator Anda.</p>
                <input type="text" id="totp-code" placeholder="123456" maxlength="6">
                <button onclick="verify2FA()" class="btn-primary">Verifikasi</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD ADMIN -->
    <div id="admin-page" class="page">
        <div class="card">
            <h3>Dashboard Admin</h3>
            
            <h4 class="section-title">Manajemen Data Master</h4>
            <div class="admin-grid">
                <div>
                    <label>Tambah Instansi</label>
                    <input type="text" id="new-instansi" placeholder="Nama Instansi Baru">
                    <button onclick="tambahInstansi()" class="btn-primary">Tambah Instansi</button>
                </div>
                <div>
                    <label>Tambah Orang Tujuan</label>
                    <input type="text" id="new-tujuan" placeholder="Nama Orang Baru">
                    <button onclick="tambahTujuan()" class="btn-primary">Tambah Orang</button>
                </div>
            </div>

            <hr style="margin: 30px 0; border-top: 1px solid #ddd;">

            <h4 class="section-title">Manajemen Akun (Otorisasi Admin)</h4>
            <div class="admin-grid">
                <div>
                    <label>Tambah Akun (Staff/Atasan)</label>
                    <input type="email" id="new-user-email" placeholder="Email Akun Baru">
                    <input type="password" id="new-user-password" placeholder="Password Akun">
                    <select id="new-user-role" style="margin-bottom: 15px;">
                        <option value="admin">Admin</option>
                        <option value="atasan">Atasan</option>
                        <option value="staff">Staff</option>
                    </select>
                    <button onclick="tambahAkun()" class="btn-primary">Buat Akun</button>
                </div>
                <div>
                    <label>Reset 2FA Pengguna</label>
                    <input type="email" id="reset-2fa-email" placeholder="Email Pengguna">
                    <button onclick="adminReset2FA()" class="btn-danger">Reset 2FA Akun</button>
                </div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD ATASAN -->
    <div id="atasan-page" class="page">
        <div class="card">
            <h3>Dashboard Atasan (Approval Tamu)</h3>
            <table class="table" id="table-approval">
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Nama Tamu</th>
                        <th>Instansi</th>
                        <th>Keperluan</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="approval-list">
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
