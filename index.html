<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Tamu Perusahaan</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Sistem Buku Tamu</h1>
        <button id="btnOpenLogin">Login Admin</button>
    </header>

    <main>
        <section class="card">
            <h2>Form Registrasi Tamu</h2>
            <form id="visitorForm">
                <div class="input-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label for="company">Asal Instansi/Perusahaan</label>
                    <input type="text" id="company" required>
                </div>
                <div class="input-group">
                    <label for="purpose">Tujuan Kunjungan</label>
                    <textarea id="purpose" rows="3" required></textarea>
                </div>
                <button type="submit" id="btnSubmitVisitor">Daftar Sekarang</button>
            </form>
            <p id="visitorMessage" class="message"></p>
        </section>
    </main>

    <!-- Modal Login Admin -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeLogin">&times;</span>
            <h2 id="modalTitle">Login Admin</h2>
            
            <!-- Step 1: Username & Password -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username / Email</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" id="btnLoginSubmit">Lanjut ke 2FA</button>
                <p class="hint">Default User: admin | Pass: admin123</p>
            </form>

            <!-- Step 2: 2FA Security -->
            <form id="twoFaForm" style="display: none;">
                <p>Masukkan 6 digit kode keamanan 2FA Anda.</p>
                <div class="input-group">
                    <label for="twoFaCode">Kode 2FA (OTP)</label>
                    <input type="text" id="twoFaCode" maxlength="6" placeholder="123456" required>
                </div>
                <button type="submit" id="btnVerify2FA">Verifikasi & Masuk</button>
                <p class="hint">Demo Kode 2FA: 123456</p>
            </form>
            <p id="loginMessage" class="message error"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
