<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Buku Tamu Perusahaan</title>
    <!-- Memuat Supabase dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Memuat file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">CompanySpace</div>
        <div class="nav-links">
            <button onclick="showPage('guest-page')">Buku Tamu</button>
            <button onclick="showPage('login-page')" id="nav-login-btn">Login Admin</button>
            <button onclick="showPage('admin-dashboard')" id="nav-dashboard-btn" style="display: none;">Dashboard</button>
            <button onclick="logoutAdmin()" id="nav-logout-btn" style="display: none;">Logout</button>
        </div>
    </nav>

    <div class="container">
        
        <!-- HALAMAN REGISTRASI TAMU -->
        <section id="guest-page" class="page-section active">
            <h2>Form Registrasi Tamu</h2>
            <p>Silakan isi data diri Anda. Admin akan memberikan persetujuan akses setelah data diverifikasi.</p>
            
            <form id="guest-form">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="guest-name" required placeholder="Masukkan nama Anda">
                </div>
                <div class="form-group">
                    <label>Asal Instansi/Perusahaan</label>
                    <input type="text" id="guest-company" required placeholder="Contoh: PT Bangun Bangsa">
                </div>
                <div class="form-group">
                    <label>Jenis ID Identity</label>
                    <select id="guest-id-type" required>
                        <option value="">-- Pilih Jenis ID --</option>
                        <option value="KTP">KTP</option>
                        <option value="SIM">SIM</option>
                        <option value="Paspor">Paspor</option>
                        <option value="Kartu Pelajar/Mahasiswa">Kartu Pelajar/Mahasiswa</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Keperluan</label>
                    <textarea id="guest-purpose" required placeholder="Contoh: Meeting dengan tim HRD"></textarea>
                </div>
                <button type="submit" class="btn-primary">Kirim Permintaan Akses</button>
            </form>
            <div id="guest-message" class="message"></div>
        </section>

        <!-- HALAMAN LOGIN ADMIN -->
        <section id="login-page" class="page-section">
            <h2>Login Administrator</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Admin</label>
                    <input type="email" id="admin-email" required placeholder="Email Admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin-password" required placeholder="Password">
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <div id="login-message" class="message error" style="display: none;"></div>
        </section>

        <!-- HALAMAN DASHBOARD ADMIN -->
        <section id="admin-dashboard" class="page-section">
            <div class="dashboard-header">
                <h2>Dashboard Admin - Kelola Buku Tamu</h2>
                <div class="dashboard-actions">
                    <button onclick="openAddAdminModal()" class="btn-secondary">+ Tambah Akun Admin</button>
                    <button onclick="resetAllConfigAndData()" class="btn-danger">Reset / Hapus Semua Data</button>
                </div>
            </div>

            <div class="table-container">
                <table id="guests-table">
                    <thead>
                        <tr>
                            <th>Waktu Register</th>
                            <th>Nama</th>
                            <th>Instansi</th>
                            <th>Jenis ID</th>
                            <th>Keperluan</th>
                            <th>Jam Masuk</th>
                            <th>Jam Keluar</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="guests-tbody">
                        <!-- Data tamu akan dimuat di sini -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- MODAL TAMBAH AKUN LOGIN ADMIN -->
    <div id="add-admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddAdminModal()">&times;</span>
            <h3>Tambah Akun Admin Baru</h3>
            <form id="add-admin-form">
                <div class="form-group">
                    <label>Email Admin Baru</label>
                    <input type="email" id="new-admin-email" required placeholder="email@domain.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="new-admin-password" required placeholder="Minimal 6 karakter">
                </div>
                <button type="submit" class="btn-primary">Buat Akun Login</button>
            </form>
            <div id="add-admin-message" class="message" style="display: none;"></div>
        </div>
    </div>

    <!-- Memuat file JavaScript eksternal -->
    <script src="app.js"></script>
</body>
</html>
