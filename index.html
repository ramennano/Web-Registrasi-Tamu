<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Sistem Manajemen Tamu</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="overlay">
    <div class="container">
      <div class="lang-switch">
        <button onclick="setLanguage('id')" class="btn btn-secondary">ID</button>
        <button onclick="setLanguage('en')" class="btn btn-secondary">EN</button>
      </div>

      <div class="brand-header">
        <img src="https://via.placeholder.com/150x50?text=Logo" alt="Logo" class="brand-logo" id="mainLogo">
        <h2 class="company-name">PT Utama Jaya</h2>
        <p data-i18n="title">Sistem Kunjungan Tamu</p>
      </div>

      <!-- Tampilan Pertama -->
      <div class="btn-group" style="flex-direction: column;">
        <a href="register.html" class="btn btn-primary" data-i18n="getStarted">Registrasi Tamu (Get Started)</a>
      </div>

      <hr style="margin: 25px 0;">

      <!-- Tampilan Kedua -->
      <div class="btn-group" style="flex-direction: column;">
        <a href="status.html" class="btn btn-success" data-i18n="checkStatus">Cek Status Kunjungan</a>
        <a href="login.html" class="btn btn-secondary" data-i18n="adminLogin">Login Admin / Super Admin</a>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
