<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="overlay">
    <div class="container">
      <a href="index.html" class="btn btn-secondary btn-back" data-i18n="back">Kembali</a>
      <h3 style="text-align: center;">Login Admin / Super Admin</h3>
      
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
      </form>

      <div style="text-align: center; margin-top: 15px;">
        <a href="#" onclick="showResetPassword()" style="font-size: 0.9em; color: #2563eb;">Lupa Password? Reset Password</a>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      const { data, error } = await supabase
        .from('admin_users')
        .select('*')
        .eq('username', u)
        .eq('password_hash', p)
        .single();

      if (data) {
        localStorage.setItem('auth_user', JSON.stringify(data));
        window.location.href = 'dashboard.html';
      } else {
        alert('Username atau Password salah!');
      }
    });

    async function showResetPassword() {
      const u = prompt('Masukkan Username Anda untuk Reset Password:');
      if (!u) return;
      const newP = prompt('Masukkan Password Baru:');
      if (!newP) return;

      const { data, error } = await supabase
        .from('admin_users')
        .update({ password_hash: newP })
        .eq('username', u);

      if (!error) {
        alert('Password berhasil diperbarui! Silakan login.');
      } else {
        alert('Gagal me-reset password: ' + error.message);
      }
    }
  </script>
</body>
</html>
